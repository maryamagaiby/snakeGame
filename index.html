<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Snake Game</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>
    <p id="message"></p>
    <p id="highScore"></p>

    <script>
        // ===== GAME SETUP =====
        /*!SECTION
        the issue , I don't understand what the current code do, i just see 2 object one is red and one is black and have no idea what is the purpose of the code, can you explain it to me in simple words, explain each line of the code and what it does, and also explain the purpose of the code in general
        
        AI response:
        This is an array containing the snake’s three segments. Each { x, y } object stores a segment’s position in grid squares. The first object is the head; the next two are the body. The segments are side by side, so they look like one short black snake.
        */
        const highScoreDisplay = document.getElementById("highScore");
        let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;

        const scoreDisplay = document.getElementById("info");
        const updateScore = () => {
            scoreDisplay.textContent = `Score: ${score}`;
            if (score > highScore) highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            highScoreDisplay.textContent = `High score: ${highScore}`;
            
        };
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        //head
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        const message = document.getElementById("message");
        let gameOver = false;
        let gameTimer;
        let gameSpeed = 200;
        updateScore();
        

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // game loop
        const startGameLoop=()=>{
            clearInterval(gameTimer);
            gameTimer=setInterval(moveSnake,gameSpeed);
            
        }
        
        const moveSnake =()=>{
            if(gameOver) return;
            let newHead= {
                x:snake[0].x + direction.x,
                y:snake[0].y + direction.y
            }
            const hitWall = newHead.x < 0 || newHead.y < 0 ||
            newHead.x >= tileCount || newHead.y >= tileCount;
            const eating = newHead.x === food.x && newHead.y === food.y;
            const body = eating ? snake : snake.slice(0, -1);
            const hitBody = body.some(part => part.x === newHead.x && part.y === newHead.y);
            if (hitWall || hitBody) {
                endGame();
            return;}
            
            
            snake.unshift(newHead);// after adding this code for the first time, would have 4 of them, the last idex of the snake array is extra, so we r=need to remove it
            
            
            
            
            if((snake[0].x ===  food.x) && (snake[0].y=== food.y) ){
                score +=1;
                gameSpeed = Math.max(80, 200 - score * 10);
                startGameLoop();    
                updateScore();
            
            //gameTimer= setInterval(moveSnake, Math.floor(Math.random() *(score*3)))
            let randomNumX= Math.floor(Math.random() *tileCount);
            let randomNumY= Math.floor(Math.random() *tileCount);
            food.x= randomNumX;
            food.y=randomNumY;
            
            //score.textContent= "score"+ score;
            
            
            
        } else{
            snake.pop();
        }
        drawGame();
            
        }
        startGameLoop();
        
        //gameTimer =setInterval(moveSnake,300);
        // Step 2: Keyboard controls (arrow keys)
        
        
        
        
        document.addEventListener('keydown', e => {
            if (e.key === "ArrowUp" && direction.y !== 1) {
                direction = { x: 0, y: -1 };
            } else if (e.key === "ArrowDown" && direction.y !== -1) {
                direction = { x: 0, y: 1 };
            } else if (e.key === "ArrowLeft" && direction.x !== 1) {
                direction = { x: -1, y: 0 };
            } else if (e.key === "ArrowRight" && direction.x !== -1) {
                direction = { x: 1, y: 0 };
            }
            
        })
        
        // Step 3: Eating and growing
        
        
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================
        
        function endGame() {
            gameOver = true;
            clearInterval(gameTimer);
            message.textContent = "Game over! Press Enter to restart.";
        }
        function restartGame(){
            // ===== INITIAL STATE =====
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            gameSpeed=200;
            gameOver=false;
            message.textContent= " ";
            startGameLoop()
            drawGame();
            updateScore();
        }

        document.addEventListener('keydown', e => {
            if (gameOver && e.key === "Enter") {
                restartGame();
                return;
            }
        });
        
    </script>

</body>
</html>
