<html lang="en">
<head>

    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }

<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        /*!SECTION
        the issue , I don't understand what the current code do, i just see 2 object one is red and one is black and have no idea what is the purpose of the code, can you explain it to me in simple words, explain each line of the code and what it does, and also explain the purpose of the code in general
        
        AI response:
        This is an array containing the snake’s three segments. Each { x, y } object stores a segment’s position in grid squares. The first object is the head; the next two are the body. The segments are side by side, so they look like one short black snake.
        */
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        //head
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // game loop
        const moveSnake =()=>{
            let newHead= {
                x:snake[0].x + direction.x,
                y:snake[0].y + direction.y
            }
            snake.unshift(newHead);// after adding this code for the first time, would have 4 of them, the last idex of the snake array is extra, so we r=need to remove it
            
            
            
            
            if((snake[0].x ===  food.x) && (snake[0].y=== food.y) ){
            score +=1;
            let randomNumX= Math.floor(Math.random() *10);
            let randomNumY= Math.floor(Math.random() *10);
            food.x= randomNumX;
            food.y=randomNumY;
            let snakeLen= snake.length;
            let currentTail= snake[snakeLen-1];
            snake.push({x: currentTail.x -1, y: currentTail.y});
            const displayScore= document.getElementById("info");
            score.innerText= "score"+ score;
            
            
            
        } else{
            snake.pop();
        }
        drawGame();
            
        }
        setInterval(moveSnake,1000);
        // Step 2: Keyboard controls (arrow keys)
        
        document.addEventListener('keydown', e => {
            if (e.key === "ArrowUp" && direction.y !== 1) {
                direction = { x: 0, y: -1 };
            } else if (e.key === "ArrowDown" && direction.y !== -1) {
                direction = { x: 0, y: 1 };
            } else if (e.key === "ArrowLeft" && direction.x !== 1) {
                direction = { x: -1, y: 0 };
            } else if (e.key === "ArrowRight" && direction.x !== -1) {
                direction = { x: 1, y: 0 };
            }
            
        })

    </script>
